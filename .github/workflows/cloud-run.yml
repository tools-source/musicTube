name: Deploy MusicTube API

on:
  push:
    branches:
      - main
      - featrue/version-9.1
    paths:
      - server.js
      - package.json
      - package-lock.json
      - Dockerfile
      - .dockerignore
      - .gcloudignore
      - .github/workflows/cloud-run.yml

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: musictube-495822
  REGION: us-east4
  SERVICE: musictube-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: "${{ env.PROJECT_ID }}"
          workload_identity_provider: projects/322459144075/locations/global/workloadIdentityPools/github/providers/music-tube
          service_account: github-musictube-deployer@musictube-495822.iam.gserviceaccount.com

      - name: Deploy AI proxy to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: "${{ env.PROJECT_ID }}"
          service: "${{ env.SERVICE }}"
          region: "${{ env.REGION }}"
          source: .
          env_vars: |-
            OPENROUTER_MODEL=google/gemini-3.1-flash-lite
            PUBLIC_APP_URL=https://music-tube.me
            TRUST_PROXY=true
          secrets: |-
            OPENROUTER_API_KEY=musictube-openrouter-api-key:latest
          secrets_update_strategy: overwrite
          flags: >-
            --max-instances=3
            --min-instances=0
            --memory=512Mi
            --cpu=1

      - name: Verify deployed health
        env:
          SERVICE_URL: "${{ steps.deploy-api.outputs.url }}"
        run: curl --fail --show-error --silent "$SERVICE_URL/health"
